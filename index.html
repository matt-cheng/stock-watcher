<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watchlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0c0f; --surface: #111418; --surface2: #181d24;
    --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
    --text: #e8eaf0; --muted: #5a6478; --muted2: #8291a8;
    --up: #22d97a; --down: #f04e5a;
    --up-bg: rgba(34,217,122,0.08); --down-bg: rgba(240,78,90,0.08);
    --accent: #4f9cff; --accent-bg: rgba(79,156,255,0.1);
    --mono: 'IBM Plex Mono', monospace; --sans: 'IBM Plex Sans', sans-serif;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; -webkit-font-smoothing: antialiased; }

  /* ── header ── */
  .header { border-bottom: 1px solid var(--border); padding: 18px 28px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--bg); z-index: 100; }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .logo { font-family: var(--mono); font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--up); animation: pulse 2s infinite; }
  .dot.error { background: var(--down); }
  .dot.loading { background: var(--muted2); }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }
  .last-update { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }
  .toggle-group { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .toggle-btn { font-family: var(--mono); font-size: 12px; font-weight: 500; padding: 7px 16px; background: transparent; border: none; color: var(--muted2); cursor: pointer; transition: all 0.15s; letter-spacing: 0.06em; }
  .toggle-btn.active { background: var(--surface2); color: var(--text); }

  /* ── main ── */
  .main { padding: 28px; max-width: 980px; margin: 0 auto; }

  /* ── setup banner ── */
  .setup-banner { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 16px 20px; margin-bottom: 28px; display: flex; align-items: flex-start; gap: 16px; }
  .setup-banner-content { flex: 1; }
  .setup-banner h3 { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--accent); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 10px; }
  .setup-steps { list-style: none; margin-bottom: 14px; }
  .setup-steps li { font-size: 12px; color: var(--muted2); line-height: 1.7; padding-left: 18px; position: relative; }
  .setup-steps li::before { content: attr(data-n); position: absolute; left: 0; color: var(--accent); font-family: var(--mono); font-size: 11px; }
  .setup-steps code { font-family: var(--mono); font-size: 11px; background: var(--surface2); padding: 1px 5px; border-radius: 3px; color: var(--text); }
  .gs-url-row { display: flex; gap: 8px; }
  .gs-url-input { font-family: var(--mono); font-size: 11px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; color: var(--text); flex: 1; outline: none; transition: border-color 0.15s; }
  .gs-url-input:focus { border-color: var(--accent); }
  .gs-url-input.invalid { border-color: var(--down); }
  .gs-save-btn { font-family: var(--mono); font-size: 11px; font-weight: 500; background: var(--accent-bg); border: 1px solid rgba(79,156,255,0.25); border-radius: 6px; padding: 8px 16px; color: var(--accent); cursor: pointer; white-space: nowrap; transition: background 0.15s; }
  .gs-save-btn:hover { background: rgba(79,156,255,0.2); }
  .dismiss-btn { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 20px; line-height: 1; padding: 0; transition: color 0.15s; flex-shrink: 0; }
  .dismiss-btn:hover { color: var(--text); }

  /* ── summary bar ── */
  .summary-bar { display: flex; gap: 28px; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
  .summary-item { display: flex; flex-direction: column; gap: 4px; }
  .summary-label { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
  .summary-val { font-family: var(--mono); font-size: 15px; font-weight: 500; }
  .summary-val.up { color: var(--up); }
  .summary-val.down { color: var(--down); }

  /* ── section header ── */
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .section-title { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }
  .refresh-btn { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; background: transparent; border: 1px solid var(--border); border-radius: 6px; padding: 6px 14px; color: var(--muted2); cursor: pointer; transition: all 0.15s; }
  .refresh-btn:hover { border-color: var(--border2); color: var(--text); }
  .refresh-btn.spinning svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── stock grid ── */
  .stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(188px, 1fr)); gap: 10px; margin-bottom: 36px; }
  .stock-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; position: relative; transition: border-color 0.15s, background 0.15s, transform 0.15s; animation: fadeIn 0.2s ease; cursor: grab; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)} }
  .stock-card:hover { border-color: var(--border2); background: var(--surface2); }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
  .ticker { font-family: var(--mono); font-size: 14px; font-weight: 600; letter-spacing: 0.04em; }
  .remove-btn { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.15s, border-color 0.15s, color 0.15s; line-height: 1; z-index: 2; }
  .stock-card:hover .remove-btn { opacity: 1; }
  .remove-btn:hover { border-color: var(--down); color: var(--down); }
  .price { font-family: var(--mono); font-size: 20px; font-weight: 500; margin-bottom: 6px; letter-spacing: -0.02em; }
  .change-badge { display: inline-block; font-family: var(--mono); font-size: 12px; font-weight: 500; padding: 3px 8px; border-radius: 4px; letter-spacing: 0.03em; }
  .change-badge.up { background: var(--up-bg); color: var(--up); }
  .change-badge.down { background: var(--down-bg); color: var(--down); }
  .card-name { font-size: 10px; color: var(--muted); margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-hint { font-family: var(--mono); font-size: 9px; color: var(--muted); margin-top: 10px; letter-spacing: 0.06em; opacity: 0; transition: opacity 0.15s; }
  .stock-card:hover .card-hint { opacity: 1; }

  /* ── skeleton ── */
  .loading-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; overflow: hidden; }
  .skeleton { background: var(--surface2); border-radius: 4px; position: relative; overflow: hidden; }
  .skeleton::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.04),transparent); animation:shimmer 1.4s infinite; }
  @keyframes shimmer { from{transform:translateX(-100%)}to{transform:translateX(100%)} }

  /* ── add form ── */
  .add-form { display: flex; gap: 10px; align-items: center; }
  .ticker-input { font-family: var(--mono); font-size: 14px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; color: var(--text); width: 160px; outline: none; transition: border-color 0.15s; }
  .ticker-input::placeholder { text-transform: none; color: var(--muted); letter-spacing: 0; font-weight: 400; }
  .ticker-input:focus { border-color: var(--accent); }
  .add-btn { font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; background: var(--accent-bg); border: 1px solid rgba(79,156,255,0.25); border-radius: 8px; padding: 10px 20px; color: var(--accent); cursor: pointer; transition: background 0.15s, border-color 0.15s; white-space: nowrap; }
  .add-btn:hover { background: rgba(79,156,255,0.18); border-color: rgba(79,156,255,0.4); }

  /* ── drag handle ── */
  .drag-handle {
    position: absolute; top: 0; left: 0; right: 0; height: 100%;
    cursor: grab; border-radius: 10px; z-index: 1;
    pointer-events: none; /* let clicks fall through to card; drag fires on card itself */
  }
  .drag-handle:active { cursor: grabbing; }
  .drag-grip {
    position: absolute; bottom: 10px; right: 10px;
    display: flex; flex-direction: column; gap: 3px;
    opacity: 0; transition: opacity 0.15s; pointer-events: none;
  }
  .drag-grip span {
    display: block; width: 14px; height: 1.5px;
    background: var(--muted); border-radius: 2px;
  }
  .stock-card:hover .drag-grip { opacity: 1; }

  /* drag states */
  .stock-card.dragging {
    opacity: 0.35; border-color: var(--accent) !important;
    background: var(--surface2) !important;
  }
  .stock-card.drag-over {
    border-color: var(--accent) !important;
    background: var(--accent-bg) !important;
    transform: scale(1.02);
  }
  .stock-grid.drag-active .stock-card:not(.dragging) {
    transition: transform 0.15s;
  }

  /* ── empty ── */
  .empty-state { grid-column: 1/-1; text-align: center; padding: 56px 0; }
  .empty-state p { font-family: var(--mono); font-size: 12px; color: var(--muted); }

  /* ── toast ── */
  .toast { position: fixed; bottom: 28px; right: 28px; background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; padding: 11px 18px; font-family: var(--mono); font-size: 12px; color: var(--muted2); transform: translateY(8px); opacity: 0; transition: all 0.18s; z-index: 200; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { border-color: rgba(240,78,90,0.35); color: var(--down); }
  .toast.success { border-color: rgba(34,217,122,0.35); color: var(--up); }

  /* ── chart modal ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    display: flex; align-items: center; justify-content: center;
    z-index: 300; opacity: 0; pointer-events: none;
    transition: opacity 0.2s; backdrop-filter: blur(4px);
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: 14px; width: 760px; max-width: calc(100vw - 40px);
    padding: 0; overflow: hidden;
    transform: translateY(16px) scale(0.98);
    transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1);
  }
  .modal-overlay.open .modal { transform: translateY(0) scale(1); }

  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 24px 16px; border-bottom: 1px solid var(--border);
  }
  .modal-title-group { display: flex; align-items: baseline; gap: 12px; }
  .modal-ticker { font-family: var(--mono); font-size: 18px; font-weight: 600; letter-spacing: 0.04em; }
  .modal-name { font-size: 12px; color: var(--muted2); }
  .modal-price-group { display: flex; align-items: baseline; gap: 10px; }
  .modal-price { font-family: var(--mono); font-size: 22px; font-weight: 500; }
  .modal-change { font-family: var(--mono); font-size: 13px; font-weight: 500; }
  .modal-change.up { color: var(--up); }
  .modal-change.down { color: var(--down); }
  .modal-close {
    width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border);
    background: transparent; color: var(--muted2); font-size: 16px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: border-color 0.15s, color 0.15s;
  }
  .modal-close:hover { border-color: var(--border2); color: var(--text); }

  .modal-body { padding: 20px 24px 24px; }

  /* range pills */
  .range-group { display: flex; gap: 6px; margin-bottom: 18px; }
  .range-btn {
    font-family: var(--mono); font-size: 11px; font-weight: 500;
    padding: 4px 12px; border-radius: 20px;
    border: 1px solid var(--border); background: transparent;
    color: var(--muted2); cursor: pointer; letter-spacing: 0.06em;
    transition: all 0.15s;
  }
  .range-btn:hover { border-color: var(--border2); color: var(--text); }
  .range-btn.active { background: var(--accent-bg); border-color: rgba(79,156,255,0.35); color: var(--accent); }

  /* chart area */
  .chart-wrap {
    position: relative; height: 240px; width: 100%;
  }
  .chart-loading {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; font-family: var(--mono); font-size: 11px;
    color: var(--muted); letter-spacing: 0.08em;
  }
  .chart-svg { width: 100%; height: 100%; display: block; }

  /* hover crosshair tooltip */
  .chart-tooltip {
    position: absolute; top: 0; left: 0;
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 6px; padding: 6px 10px;
    font-family: var(--mono); font-size: 11px; color: var(--text);
    pointer-events: none; opacity: 0; transition: opacity 0.1s;
    white-space: nowrap; z-index: 10;
  }
  .chart-tooltip.visible { opacity: 1; }

  /* stats row */
  .chart-stats {
    display: flex; gap: 24px; margin-top: 18px;
    padding-top: 16px; border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .cstat { display: flex; flex-direction: column; gap: 3px; }
  .cstat-label { font-family: var(--mono); font-size: 9px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
  .cstat-val { font-family: var(--mono); font-size: 13px; font-weight: 500; }
  .cstat-val.up { color: var(--up); }
  .cstat-val.down { color: var(--down); }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <span class="logo">Watchlist</span>
    <div class="dot loading" id="statusDot"></div>
    <span class="last-update" id="lastUpdate">Loading…</span>
  </div>
  <div class="toggle-group">
    <button class="toggle-btn active" id="toggleDollar" onclick="setMode('dollar')">$ Change</button>
    <button class="toggle-btn" id="togglePct" onclick="setMode('pct')">% Change</button>
  </div>
</div>

<div class="main">
  <div class="setup-banner" id="setupBanner">
    <div class="setup-banner-content">
      <h3>Connect Live Data via Google Apps Script</h3>
      <ul class="setup-steps">
        <li data-n="1.">Go to <code>script.google.com</code> → New Project, paste <code>Code.gs</code></li>
        <li data-n="2.">Click <code>Deploy → New Deployment → Web App</code></li>
        <li data-n="3.">Set <code>Execute as: Me</code> and <code>Who has access: Anyone</code></li>
        <li data-n="4.">Copy the <code>/exec</code> URL and paste it below</li>
      </ul>
      <div class="gs-url-row">
        <input class="gs-url-input" id="gsUrlInput" placeholder="https://script.google.com/macros/s/…/exec" />
        <button class="gs-save-btn" onclick="saveGsUrl()">Save & Connect</button>
      </div>
    </div>
    <button class="dismiss-btn" onclick="dismissBanner()">×</button>
  </div>

  <div class="summary-bar" id="summaryBar" style="display:none;"></div>

  <div class="section-header">
    <span class="section-title" id="watchlistLabel">Watching — 0 stocks</span>
    <button class="refresh-btn" id="refreshBtn" onclick="fetchAll()">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M23 4v6h-6M1 20v-6h6"/>
        <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
      </svg>
      Refresh
    </button>
  </div>

  <div class="stock-grid" id="stockGrid"></div>

  <div class="add-form">
    <input class="ticker-input" id="tickerInput" placeholder="Ticker, e.g. AAPL" maxlength="10"
           onkeydown="if(event.key==='Enter')addStock()" />
    <button class="add-btn" onclick="addStock()">+ Add Stock</button>
  </div>
</div>

<!-- Chart modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title-group">
          <span class="modal-ticker" id="modalTicker">—</span>
          <span class="modal-name" id="modalName"></span>
        </div>
        <div class="modal-price-group" style="margin-top:4px;">
          <span class="modal-price" id="modalPrice">—</span>
          <span class="modal-change" id="modalChange"></span>
        </div>
      </div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="range-group" id="rangeGroup">
        <button class="range-btn" onclick="setRange('1mo')">1M</button>
        <button class="range-btn" onclick="setRange('3mo')">3M</button>
        <button class="range-btn" onclick="setRange('6mo')">6M</button>
        <button class="range-btn active" onclick="setRange('1y')">1Y</button>
        <button class="range-btn" onclick="setRange('2y')">2Y</button>
        <button class="range-btn" onclick="setRange('5y')">5Y</button>
      </div>
      <div class="chart-wrap" id="chartWrap">
        <div class="chart-loading" id="chartLoading">LOADING CHART…</div>
        <svg class="chart-svg" id="chartSvg" style="display:none;" viewBox="0 0 712 240" preserveAspectRatio="none"></svg>
        <div class="chart-tooltip" id="chartTooltip"></div>
      </div>
      <div class="chart-stats" id="chartStats"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── state ─────────────────────────────────────────────────────────────────────
let mode      = 'dollar';
let tickers   = [];
let stockData = {};
let gsUrl     = '';
let usingDemo = false;

// chart state
let currentTicker = null;
let currentRange  = '1y';
let chartPoints   = [];

// ── storage ───────────────────────────────────────────────────────────────────
async function storageGet(key) {
  try { const r = await window.storage.get(key); return r ? r.value : null; }
  catch { return null; }
}
async function storageSet(key, val) {
  try { await window.storage.set(key, val); } catch(e) { console.warn('storage set failed', e); }
}

// ── boot ──────────────────────────────────────────────────────────────────────
async function init() {
  const saved = await storageGet('tickers');
  tickers = saved ? JSON.parse(saved) : ['AAPL','MSFT','GOOGL','AMZN','NVDA'];
  gsUrl = (await storageGet('gsUrl')) || '';
  const dismissed = (await storageGet('bannerDismissed')) === '1';
  if (gsUrl) document.getElementById('gsUrlInput').value = gsUrl;
  if (dismissed) document.getElementById('setupBanner').style.display = 'none';
  renderSkeletons();
  await fetchAll();
}

// ── toggle ────────────────────────────────────────────────────────────────────
function setMode(m) {
  mode = m;
  document.getElementById('toggleDollar').classList.toggle('active', m === 'dollar');
  document.getElementById('togglePct').classList.toggle('active', m === 'pct');
  renderCards();
}

// ── GS URL ────────────────────────────────────────────────────────────────────
async function saveGsUrl() {
  const inp = document.getElementById('gsUrlInput');
  const val = inp.value.trim();
  if (!val.startsWith('https://script.google.com/')) {
    inp.classList.add('invalid');
    showToast('Paste a valid script.google.com URL', 'error');
    setTimeout(() => inp.classList.remove('invalid'), 1800);
    return;
  }
  gsUrl = val;
  await storageSet('gsUrl', gsUrl);
  showToast('Connected — fetching live data…', 'success');
  fetchAll();
}

async function dismissBanner() {
  document.getElementById('setupBanner').style.display = 'none';
  await storageSet('bannerDismissed', '1');
}

// ── fetch quotes ──────────────────────────────────────────────────────────────
async function fetchAll() {
  if (tickers.length === 0) { renderCards(); return; }
  const dot = document.getElementById('statusDot');
  const btn = document.getElementById('refreshBtn');
  dot.className = 'dot loading';
  btn.classList.add('spinning');
  document.getElementById('lastUpdate').textContent = 'Updating…';

  if (gsUrl) {
    try { await fetchFromGS(); usingDemo = false; }
    catch(err) {
      console.warn('GS fetch failed:', err);
      showToast('GS failed — trying Yahoo Finance…', 'error');
      try { await fetchLiveQuotes(); usingDemo = false; }
      catch(err2) { console.warn('Yahoo also failed:', err2); usingDemo = true; seedDemoData(); }
    }
  } else {
    // No GAS configured — go straight to Yahoo Finance
    try { await fetchLiveQuotes(); usingDemo = false; }
    catch(err) { console.warn('Yahoo fetch failed (sandbox?):', err); usingDemo = true; seedDemoData(); }
  }

  dot.className = usingDemo ? 'dot error' : 'dot';
  btn.classList.remove('spinning');
  const now = new Date();
  const ts = now.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  document.getElementById('lastUpdate').textContent = usingDemo ? `demo · ${ts}` : `live · ${ts}`;
  renderCards();
  renderSummary();
  initDrag();
}

async function fetchFromGS() {
  const url = `${gsUrl}?symbols=${encodeURIComponent(tickers.join(','))}`;
  const res = await fetch(url, { redirect: 'follow' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const text = await res.text();
  let json;
  try { json = JSON.parse(text); } catch { throw new Error('Response was not JSON'); }
  if (json.error) throw new Error(json.error);
  if (!json.data) throw new Error('Unexpected response shape');
  json.data.forEach(d => { if (!d.error) stockData[d.symbol] = d; });
}

// Fetch live quotes from Yahoo Finance (works in any real browser, no API key)
async function fetchLiveQuotes() {
  const results = await Promise.allSettled(tickers.map(async t => {
    // Use the chart endpoint — its meta block always has regularMarketPrice + previousClose
    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(t)}?range=1d&interval=1d&includePrePost=false`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    const meta = json?.chart?.result?.[0]?.meta;
    if (!meta?.regularMarketPrice) throw new Error('No price in meta');
    const price = meta.regularMarketPrice;
    const prev  = meta.previousClose || meta.chartPreviousClose || price;
    const change = +(price - prev).toFixed(2);
    const changePct = +((change / prev) * 100).toFixed(2);
    return {
      symbol: t,
      price:  +price.toFixed(2),
      change,
      changePercent: changePct,
      name: meta.shortName || meta.longName || t,
    };
  }));

  let anyOk = false;
  results.forEach((r, i) => {
    if (r.status === 'fulfilled') { stockData[tickers[i]] = r.value; anyOk = true; }
    else console.warn(`Yahoo quote failed for ${tickers[i]}:`, r.reason);
  });
  if (!anyOk) throw new Error('All Yahoo quote fetches failed');
}

// True last-resort fallback — seeded random, clearly marked demo
function seedDemoData() {
  tickers.forEach(t => {
    // Only fill in tickers we don't already have data for
    if (stockData[t]) return;
    const seed  = t.split('').reduce((a,c) => a*31+c.charCodeAt(0), 1);
    const base  = (Math.abs(seed) % 450) + 50;
    const rng   = ((seed * 9301 + 49297) % 233280) / 233280;
    const change = (rng - 0.47) * base * 0.06;
    stockData[t] = { symbol:t, price:+(base+change).toFixed(2), change:+change.toFixed(2), changePercent:+((change/base)*100).toFixed(2), name:t };
  });
}

// ── render cards ──────────────────────────────────────────────────────────────
function renderSkeletons() {
  document.getElementById('stockGrid').innerHTML = tickers.map(() => `
    <div class="loading-card">
      <div class="skeleton" style="height:11px;width:44px;margin-bottom:14px;"></div>
      <div class="skeleton" style="height:20px;width:88px;margin-bottom:8px;"></div>
      <div class="skeleton" style="height:11px;width:60px;"></div>
    </div>`).join('');
}

function renderCards() {
  const grid = document.getElementById('stockGrid');
  document.getElementById('watchlistLabel').textContent =
    `Watching — ${tickers.length} stock${tickers.length !== 1 ? 's' : ''}`;

  if (tickers.length === 0) {
    grid.innerHTML = '<div class="empty-state"><p>No stocks yet — add one below.</p></div>';
    document.getElementById('summaryBar').style.display = 'none';
    return;
  }

  grid.innerHTML = tickers.map(t => {
    const d = stockData[t];
    if (!d) return `<div class="loading-card">
      <div class="skeleton" style="height:11px;width:44px;margin-bottom:14px;"></div>
      <div class="skeleton" style="height:20px;width:88px;margin-bottom:8px;"></div>
      <div class="skeleton" style="height:11px;width:60px;"></div>
    </div>`;
    const isUp = d.change >= 0, cls = isUp?'up':'down';
    const sign = isUp ? '+' : '', arrow = isUp ? '▲' : '▼';
    const display = mode === 'dollar'
      ? `${sign}$${Math.abs(d.change).toFixed(2)}`
      : `${sign}${d.changePercent.toFixed(2)}%`;
    return `<div class="stock-card" data-ticker="${t}" draggable="true" onclick="if(!didDrag)openChart('${t}')">
      <div class="drag-handle" data-drag="${t}"></div>
      <div class="card-top">
        <span class="ticker">${d.symbol}</span>
        <button class="remove-btn" onclick="event.stopPropagation();removeStock('${t}')">×</button>
      </div>
      <div class="price">$${d.price.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
      <span class="change-badge ${cls}">${arrow} ${display}</span>
      ${d.name && d.name !== d.symbol ? `<div class="card-name">${d.name}</div>` : ''}
      <div class="card-hint">CLICK FOR CHART · DRAG TO REORDER</div>
      <div class="drag-grip"><span></span><span></span><span></span></div>
    </div>`;
  }).join('');
}

function renderSummary() {
  const bar = document.getElementById('summaryBar');
  const loaded = tickers.filter(t => stockData[t]);
  if (loaded.length === 0) { bar.style.display='none'; return; }
  const gainers = loaded.filter(t => stockData[t].change > 0).length;
  const losers  = loaded.filter(t => stockData[t].change < 0).length;
  const avgPct  = loaded.reduce((s,t) => s+stockData[t].changePercent, 0) / loaded.length;
  const sign = avgPct >= 0 ? '+' : '';
  const src  = usingDemo ? ' <span style="color:var(--muted);font-size:10px">(demo)</span>' : '';
  bar.style.display = 'flex';
  bar.innerHTML = `
    <div class="summary-item"><span class="summary-label">Avg Change${src}</span><span class="summary-val ${avgPct>=0?'up':'down'}">${sign}${avgPct.toFixed(2)}%</span></div>
    <div class="summary-item"><span class="summary-label">Gainers</span><span class="summary-val up">${gainers}</span></div>
    <div class="summary-item"><span class="summary-label">Losers</span><span class="summary-val down">${losers}</span></div>
    <div class="summary-item"><span class="summary-label">Tracking</span><span class="summary-val">${loaded.length}</span></div>`;
}

// ── chart modal ───────────────────────────────────────────────────────────────
function openChart(ticker) {
  currentTicker = ticker;
  currentRange  = '1y';
  const d = stockData[ticker] || {};

  document.getElementById('modalTicker').textContent = ticker;
  document.getElementById('modalName').textContent = (d.name && d.name !== ticker) ? d.name : '';
  document.getElementById('modalPrice').textContent = d.price ? `$${d.price.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}` : '—';

  const isUp = (d.change || 0) >= 0;
  const sign = isUp ? '+' : '';
  const chEl = document.getElementById('modalChange');
  chEl.className = `modal-change ${isUp?'up':'down'}`;
  chEl.textContent = d.change
    ? `${sign}$${d.change.toFixed(2)}  ${sign}${d.changePercent.toFixed(2)}%`
    : '';

  // activate 1Y range button
  document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.range-btn')[3].classList.add('active'); // 1Y

  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';

  loadChart(ticker, '1y');
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay') && !e.target.classList.contains('modal-close')) return;
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

// ESC key closes modal
document.addEventListener('keydown', e => { if (e.key === 'Escape') { document.getElementById('modalOverlay').classList.remove('open'); document.body.style.overflow = ''; } });

function setRange(range) {
  currentRange = range;
  document.querySelectorAll('.range-btn').forEach(b => {
    b.classList.toggle('active', b.textContent === rangeLabel(range));
  });
  loadChart(currentTicker, range);
}

function rangeLabel(r) { return {  '1mo':'1M','3mo':'3M','6mo':'6M','1y':'1Y','2y':'2Y','5y':'5Y' }[r] || r; }

async function loadChart(ticker, range) {
  const svg    = document.getElementById('chartSvg');
  const loader = document.getElementById('chartLoading');
  const stats  = document.getElementById('chartStats');
  svg.style.display = 'none';
  loader.style.display = 'flex';
  stats.innerHTML = '';
  chartPoints = [];

  try {
    // Yahoo Finance v8 chart API — free, no key, works from any browser
    const interval = range === '1mo' ? '1d' : range === '3mo' ? '1d' : range === '6mo' ? '1d' : range === '1y' ? '1wk' : range === '2y' ? '1wk' : '1mo';
    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?range=${range}&interval=${interval}&includePrePost=false`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`Yahoo returned ${res.status}`);
    const json = await res.json();
    const result = json.chart?.result?.[0];
    if (!result) throw new Error('No chart data');

    const closes = result.indicators.quote[0].close;
    const times  = result.timestamp;
    // filter nulls
    chartPoints = times.map((t,i) => ({ t: t*1000, v: closes[i] })).filter(p => p.v != null);
    if (chartPoints.length < 2) throw new Error('Not enough data points');

    drawChart(chartPoints, ticker);
    renderChartStats(chartPoints, range);
  } catch(err) {
    console.warn('Chart fetch failed, using demo data:', err);
    chartPoints = generateDemoChart(ticker, range);
    drawChart(chartPoints, ticker);
    renderChartStats(chartPoints, range);
  }

  loader.style.display = 'none';
  svg.style.display = 'block';
}

function generateDemoChart(ticker, range) {
  const days = { '1mo':30,'3mo':90,'6mo':180,'1y':365,'2y':730,'5y':1825 }[range] || 365;
  const currentPrice = stockData[ticker]?.price || 100;
  const seed = ticker.split('').reduce((a,c)=>a*31+c.charCodeAt(0),1);
  const points = [];
  const steps = Math.min(days, 252); // ~trading days
  let price = currentPrice * (0.8 + ((seed % 40) / 100)); // start lower for upward trend variation
  const now = Date.now();
  const stepMs = (days * 86400000) / steps;
  for (let i = 0; i <= steps; i++) {
    const rng = Math.sin(seed * i * 0.1 + i) * 0.5 + 0.5;
    const drift = 0.0003;
    const vol   = 0.015;
    price = price * (1 + drift + (rng - 0.5) * vol * 2);
    points.push({ t: now - (steps - i) * stepMs, v: +price.toFixed(2) });
  }
  // nudge last point to match current price
  const scale = currentPrice / points[points.length-1].v;
  return points.map(p => ({ t: p.t, v: +(p.v * scale).toFixed(2) }));
}

function drawChart(points, ticker) {
  const W = 712, H = 240, padL = 56, padR = 12, padT = 12, padB = 32;
  const svg = document.getElementById('chartSvg');

  const vals  = points.map(p => p.v);
  const minV  = Math.min(...vals);
  const maxV  = Math.max(...vals);
  const rangeV = maxV - minV || 1;

  const isUp = points[points.length-1].v >= points[0].v;
  const color = isUp ? '#22d97a' : '#f04e5a';
  const colorFade = isUp ? 'rgba(34,217,122,' : 'rgba(240,78,90,';

  const xScale = i => padL + (i / (points.length-1)) * (W - padL - padR);
  const yScale = v => padT + (1 - (v - minV) / rangeV) * (H - padT - padB);

  // build path
  const line = points.map((p,i) => `${i===0?'M':'L'}${xScale(i).toFixed(1)},${yScale(p.v).toFixed(1)}`).join(' ');
  const areaClose = `L${xScale(points.length-1).toFixed(1)},${(H-padB).toFixed(1)} L${xScale(0).toFixed(1)},${(H-padB).toFixed(1)} Z`;

  // y-axis grid lines
  const gridLines = [];
  const gridCount = 4;
  for (let i = 0; i <= gridCount; i++) {
    const v = minV + (rangeV * i / gridCount);
    const y = yScale(v).toFixed(1);
    gridLines.push(`
      <line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
      <text x="${padL-6}" y="${(+y+4).toFixed(1)}" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="9" fill="rgba(255,255,255,0.25)">$${v >= 1000 ? (v/1000).toFixed(1)+'k' : v.toFixed(0)}</text>
    `);
  }

  // x-axis labels (4 evenly spaced)
  const xLabels = [];
  const labelIdxs = [0, Math.floor(points.length*0.33), Math.floor(points.length*0.66), points.length-1];
  labelIdxs.forEach(idx => {
    if (!points[idx]) return;
    const d = new Date(points[idx].t);
    const label = d.toLocaleDateString('en-US', { month:'short', year:'2-digit' });
    xLabels.push(`<text x="${xScale(idx).toFixed(1)}" y="${H-8}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="9" fill="rgba(255,255,255,0.25)">${label}</text>`);
  });

  const gradId = `grad_${ticker}`;

  svg.innerHTML = `
    <defs>
      <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${colorFade}0.18)"/>
        <stop offset="100%" stop-color="${colorFade}0)"/>
      </linearGradient>
    </defs>
    ${gridLines.join('')}
    ${xLabels.join('')}
    <path d="${line} ${areaClose}" fill="url(#${gradId})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${xScale(points.length-1).toFixed(1)}" cy="${yScale(points[points.length-1].v).toFixed(1)}" r="3" fill="${color}"/>
    <rect id="chartHitArea" x="${padL}" y="${padT}" width="${W-padL-padR}" height="${H-padT-padB}" fill="transparent" style="cursor:crosshair"/>
    <line id="crosshair" x1="0" y1="${padT}" x2="0" y2="${H-padB}" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="3,3" style="display:none"/>
    <circle id="crosshairDot" cx="0" cy="0" r="4" fill="${color}" stroke="var(--surface)" stroke-width="2" style="display:none"/>
  `;

  // crosshair interaction
  const hitArea = document.getElementById('chartHitArea');
  const crosshair = document.getElementById('crosshair');
  const dot = document.getElementById('crosshairDot');
  const tooltip = document.getElementById('chartTooltip');
  const svgEl = document.getElementById('chartSvg');
  const wrap  = document.getElementById('chartWrap');

  hitArea.addEventListener('mousemove', e => {
    const rect = svgEl.getBoundingClientRect();
    const svgW = rect.width, svgH = rect.height;
    const mx = (e.clientX - rect.left) * (W / svgW);
    const my = (e.clientY - rect.top)  * (H / svgH);

    const frac = Math.max(0, Math.min(1, (mx - padL) / (W - padL - padR)));
    const idx  = Math.round(frac * (points.length - 1));
    const pt   = points[idx];
    if (!pt) return;

    const cx = xScale(idx), cy = yScale(pt.v);
    crosshair.setAttribute('x1', cx.toFixed(1)); crosshair.setAttribute('x2', cx.toFixed(1));
    crosshair.style.display = '';
    dot.setAttribute('cx', cx.toFixed(1)); dot.setAttribute('cy', cy.toFixed(1));
    dot.style.display = '';

    const date  = new Date(pt.t).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
    const chg   = pt.v - points[0].v;
    const pct   = ((chg / points[0].v) * 100).toFixed(2);
    const chgSign = chg >= 0 ? '+' : '';
    tooltip.innerHTML = `<span style="color:var(--muted2)">${date}</span>  <strong>$${pt.v.toFixed(2)}</strong>  <span style="color:${chg>=0?'var(--up)':'var(--down)'}">${chgSign}${pct}%</span>`;
    tooltip.classList.add('visible');

    // position tooltip
    const tx = (cx / W) * svgEl.clientWidth;
    const ty = (cy / H) * svgEl.clientHeight;
    const tw = tooltip.offsetWidth;
    const left = tx + 12 + tw > wrap.clientWidth ? tx - tw - 8 : tx + 12;
    tooltip.style.left = left + 'px';
    tooltip.style.top  = Math.max(0, ty - 20) + 'px';
  });

  hitArea.addEventListener('mouseleave', () => {
    crosshair.style.display = 'none';
    dot.style.display = 'none';
    tooltip.classList.remove('visible');
  });
}

function renderChartStats(points, range) {
  const first = points[0].v, last = points[points.length-1].v;
  const chg   = last - first;
  const pct   = ((chg / first) * 100).toFixed(2);
  const sign  = chg >= 0 ? '+' : '';
  const cls   = chg >= 0 ? 'up' : 'down';
  const high  = Math.max(...points.map(p=>p.v));
  const low   = Math.min(...points.map(p=>p.v));
  const label = { '1mo':'1 Month','3mo':'3 Months','6mo':'6 Months','1y':'1 Year','2y':'2 Years','5y':'5 Years' }[range] || range;

  document.getElementById('chartStats').innerHTML = `
    <div class="cstat"><span class="cstat-label">${label} Return</span><span class="cstat-val ${cls}">${sign}${pct}%</span></div>
    <div class="cstat"><span class="cstat-label">${label} Change</span><span class="cstat-val ${cls}">${sign}$${Math.abs(chg).toFixed(2)}</span></div>
    <div class="cstat"><span class="cstat-label">Period High</span><span class="cstat-val">$${high.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</span></div>
    <div class="cstat"><span class="cstat-label">Period Low</span><span class="cstat-val">$${low.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</span></div>
    <div class="cstat"><span class="cstat-label">Data Points</span><span class="cstat-val">${points.length}</span></div>`;
}

// ── add / remove ──────────────────────────────────────────────────────────────
async function addStock() {
  const input  = document.getElementById('tickerInput');
  const ticker = input.value.trim().toUpperCase().replace(/[^A-Z.]/g,'');
  if (!ticker) return;
  if (tickers.includes(ticker)) { showToast(`${ticker} is already on your list`, 'error'); input.value=''; return; }
  tickers.push(ticker);
  await save();
  input.value = '';
  renderSkeletons();
  await fetchAll();
  showToast(`${ticker} added`, 'success');
}

async function removeStock(ticker) {
  tickers = tickers.filter(t => t !== ticker);
  delete stockData[ticker];
  await save();
  renderCards();
  renderSummary();
  initDrag();
  showToast(`${ticker} removed`);
}

async function save() { await storageSet('tickers', JSON.stringify(tickers)); }

// ── toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = `toast show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className='toast'; }, 2800);
}

// ── drag to reorder ───────────────────────────────────────────────────────────
let dragSrc  = null;
let didDrag  = false;  // prevent click firing after a drag

function initDrag() {
  const grid = document.getElementById('stockGrid');

  grid.addEventListener('dragstart', e => {
    const card = e.target.closest('.stock-card[data-ticker]');
    if (!card) return;
    dragSrc = card;
    didDrag = false;
    card.classList.add('dragging');
    grid.classList.add('drag-active');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', card.dataset.ticker);
  });

  grid.addEventListener('dragend', e => {
    const card = e.target.closest('.stock-card[data-ticker]');
    if (card) { card.classList.remove('dragging'); }
    grid.classList.remove('drag-active');
    grid.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    dragSrc = null;
    // Block the subsequent click event for a brief moment
    setTimeout(() => { didDrag = false; }, 100);
  });

  grid.addEventListener('dragover', e => {
    e.preventDefault();
    didDrag = true;
    e.dataTransfer.dropEffect = 'move';
    const target = e.target.closest('.stock-card[data-ticker]');
    if (!target || target === dragSrc) return;
    grid.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    target.classList.add('drag-over');
  });

  grid.addEventListener('dragleave', e => {
    const target = e.target.closest('.stock-card[data-ticker]');
    if (target) target.classList.remove('drag-over');
  });

  grid.addEventListener('drop', async e => {
    e.preventDefault();
    const target = e.target.closest('.stock-card[data-ticker]');
    if (!target || !dragSrc || target === dragSrc) return;

    const fromTicker = dragSrc.dataset.ticker;
    const toTicker   = target.dataset.ticker;
    const fromIdx    = tickers.indexOf(fromTicker);
    const toIdx      = tickers.indexOf(toTicker);
    if (fromIdx === -1 || toIdx === -1) return;

    tickers.splice(fromIdx, 1);
    tickers.splice(toIdx, 0, fromTicker);
    await save();

    target.classList.remove('drag-over');
    renderCards();
    initDrag();
  });
}

init();
setInterval(fetchAll, 60000);
